bug: OAuth credential authentication in container mode
type: bug
severity: major
reported: 2026-03-19
status: approved

gates:
  investigation:
    status: done
    root_cause: |
      Three distinct auth failures in container mode:
      1. Claude Code OAuth race condition — multiple bare-mode agents sharing
         ~/.claude/.credentials.json race to refresh the token, losers get 401.
      2. Anthropic API rejects proxied OAuth tokens — the proxy injected OAuth
         Bearer tokens into requests to api.anthropic.com, which returns
         "OAuth authentication is currently not supported."
      3. Codex ChatGPT OAuth scope mismatch — the proxy routed Codex requests
         to api.openai.com/v1/responses, but ChatGPT OAuth tokens lack the
         api.responses.write scope. In bare mode, Codex routes to ChatGPT's
         internal API where the token works fine.
      Additional issues found during fix:
      4. Codex config.toml [model] table vs top-level string (Codex 0.115)
      5. Codex .codex/ dir mounted :ro but needs write access
      6. OPENAI_BASE_URL env var deprecated in Codex 0.115
      7. Codex 0.115 sends /responses not /v1/responses
      8. o4-mini model not supported with ChatGPT accounts
      9. Root's ~/.codex/auth.json stale (March 10), llmuser's fresh (March 18)
    files_affected:
      - container/fb-credential-proxy.cjs
      - .board/board/BOARD.md
      - .board/board/systems-thinker/.codex/config.toml
      - .claude/skills/setup/SKILL.md
      - .claude/skills/debug/SKILL.md
      - .claude/skills/debug-bug/SKILL.md
    touches_security: true  # credential proxy, container isolation, auth
    date: 2026-03-19

  classification:
    status: done
    severity: major
    escalated: true  # touches credential proxy + container boundary
    board_required: false  # fixing and testing directly with user
    date: 2026-03-19

  board_review:
    status: skipped  # user opted to fix directly with iterative testing
    rounds: 0
    findings: []
    date: 2026-03-19

  fix:
    status: done
    files_modified:
      - container/fb-credential-proxy.cjs  # per-request credential reading, improved upstream detection, path normalization
      - .board/board/BOARD.md  # switched to container mode, CLAUDE_CODE_OAUTH_TOKEN, native Codex auth
      - .board/board/systems-thinker/.codex/config.toml  # removed model, removed openai_base_url
      - .claude/skills/setup/SKILL.md  # updated container auth templates
      - .claude/skills/debug/SKILL.md  # new diagnostic skill with 13 sections
      - .claude/skills/debug-bug/SKILL.md  # new bug lifecycle skill with 8 phases
      - CLAUDE.md  # added /debug and /debug-bug routing
    regression_test: true  # smoke tests for all 3 agents
    date: 2026-03-19

  smoke_test:
    status: done
    method: 'all 3 agents in parallel, container mode, no proxy for Claude/Codex'
    result: 'all 3 passed — Pragmatist (Claude/OAuth), Systems Thinker (Codex/native), Skeptic (Claude/OAuth)'
    all_agents_pass: true
    skipped_reason: null
    date: 2026-03-19

  code_review:
    status: skipped  # user reviewing changes directly
    rounds: 0
    findings: []
    date: 2026-03-19

  cleanup:
    status: done
    artifacts_removed:
      - smoke test briefs/reports from all agent inboxes/outboxes
      - copied Codex auth.json (contains credentials)
      - proxy PID file and /tmp/proxy.log
      - stale review lockfile
      - temp credential copies
    date: 2026-03-19

  final_signoff:
    status: approved
    date: 2026-03-19
