bug: OAuth credential authentication in container mode
type: bug
severity: major
reported: 2026-03-19
status: shipping  # all gates passed, committing

gates:
  investigation:
    status: done
    root_cause: |
      Three distinct auth failures in container mode:
      1. Anthropic API rejects proxied OAuth tokens — proxy injected Bearer tokens
         that api.anthropic.com returns "OAuth authentication is currently not supported."
      2. Codex ChatGPT OAuth scope mismatch — proxy routed to api.openai.com where
         ChatGPT OAuth tokens lack api.responses.write scope.
      3. Credential proxy read tokens once at startup — refreshed tokens never picked up.
      Additional: Codex config.toml format, .codex/ read-only mount, /responses path,
      o4-mini model obsolete, .env mount failure, CLI dir permissions.
    files_affected:
      - container/fb-credential-proxy.cjs
      - container/Dockerfile
      - container/entrypoint.sh
      - .claude/skills/setup/SKILL.md
      - .claude/skills/run/SKILL.md
      - .claude/skills/debug/SKILL.md
      - .claude/skills/debug-bug/SKILL.md
    touches_security: true
    date: 2026-03-19

  classification:
    status: done
    severity: major
    escalated: true
    board_required: true
    date: 2026-03-19

  board_review:
    status: done
    rounds: 4
    verdict: 2 SIGN OFF + 1 BLOCK (resolved — M4 investigated, no mismatch)
    findings:
      - C1: Dockerfile add ripgrep (FIX NOW, 3/3)
      - C2: Git safe.directory wildcard in Dockerfile (FIX NOW, 3/3 — ST block overridden)
      - C3: HWK #7 o4-mini → gpt-5.4/gpt-5.3-codex (FIX NOW, 2/3)
      - C4: Auth.json crash-safe cleanup with trap + proxy stop (FIX NOW, 3/3)
      - C5: Proxy split available vs proxyable creds in /health (FIX NOW, 2/3)
      - C6: Per-round token extraction + empty guard (FIX NOW, 2/3)
      - C7: Entrypoint hard-fail on proxy miss with 3-retry (FIX NOW, owner override)
      - C8: Proxy idle timer FB_PROXY_MAX_IDLE=7200 (FIX NOW, 3/3)
      - C10: Setup validate credentials at Step 5 (FIX NOW, owner override)
      - M5: chmod 644→600 in debug-bug/SKILL.md (FIX NOW)
    date: 2026-03-20

  fix:
    status: done
    files_modified:
      - container/fb-credential-proxy.cjs  # C5: proxyable vs available in /health, self-contained error msg
      - container/Dockerfile  # C1: ripgrep, C2: git safe.directory wildcard
      - container/entrypoint.sh  # C7: hard-fail with 3-retry on proxy miss
      - .claude/skills/run/SKILL.md  # C4: trap+sweep, C6: per-round extraction+guard, C8: MAX_IDLE=7200
      - .claude/skills/setup/SKILL.md  # C3: model names, C6: template guards, C10: credential validation, R1-E: reframed claim
      - .claude/skills/debug/SKILL.md  # C3: model names consistent with setup (R1-B)
      - .claude/skills/debug-bug/SKILL.md  # M5: chmod 600, python3→node extraction
      - docs/REVIEW-SOP.md  # FB-010: failed agents must be re-run
    regression_test: pending
    date: 2026-03-20

  smoke_test:
    status: done
    method: all 3 agents in parallel, container mode, rebuilt image
    result: all 3 passed — Pragmatist (Claude/OAuth), Systems Thinker (Codex/native gpt-5.4), Skeptic (Claude/OAuth)
    all_agents_pass: true
    skipped_reason: null
    date: 2026-03-20

  code_review:
    status: done
    rounds: 4  # R1 blind, R2 remaining items, R3 deliberation, R4 confirmation
    verdict: 2 SIGN OFF + 1 BLOCK (Systems Thinker on wildcard safe.directory — overridden by owner)
    findings:
      - R1-A: Wildcard safe.directory — ACCEPT (owner override of ST block)
      - R1-B: Model name inconsistency — FIX NOW (3/3, implemented)
      - R1-C: Proxyable /health detection — DEFER
      - R1-D: Exit code propagation — ACCEPT
